<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C3X4.0_MAE | HABITAÇÃO SOBERANA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="matrix">

<canvas id="portal-canvas"></canvas>

<header>
    <div class="brand">
        <h1 id="titulo-habitacao">C3X4.0_MAE</h1>
        <div id="dna-pulse" onclick="identificarDono()"></div>
    </div>
    
    <nav id="nav-global">
        <button onclick="navegar('acervo')">ACERVO</button>
        <button onclick="navegar('caderno')">CADERNO</button>
        <button onclick="navegar('midia')">MÍDIA</button>
        <button onclick="navegar('saude')">SAÚDE</button>
        <button onclick="navegar('oficina')">OFICINA</button>
        <button onclick="navegar('reforma')">REFORMA</button>
        <button onclick="navegar('backup')">BACKUP</button>
    </nav>
</header>

<main>
    <section class="telemetria-dashboard">
        <div class="stat-card"><small>UPTIME</small><b id="uptime">00:00</b></div>
        <div class="stat-card"><small>ELEMENTS</small><b id="st-elements">LIMPO</b></div>
        <div class="stat-card"><small>NETWORK</small><b id="st-network">OFFLINE</b></div>
        <div class="stat-card"><small>CONSOLE</small><b id="st-console">SILÊNCIO</b></div>
    </section>

    <section id="acervo" class="room">
        <h2>🖼 ACERVO DE MEMÓRIAS</h2>
        <div class="upload-zone">
            <input type="file" id="inp-foto" multiple hidden onchange="injetarFotos(this)">
            <button class="btn-exp" onclick="document.getElementById('inp-foto').click()">INJETAR FOTOS NO DNA</button>
        </div>
        <div id="grid-fotos" class="gallery-grid"></div>
    </section>

    <section id="caderno" class="room" style="display:none;">
        <h2>📒 CADERNO DE REGISTROS</h2>
        <textarea id="txt-logs" placeholder="Memórias, receitas e registros soberanos..."></textarea>
        <div class="grid-2">
            <button class="btn-exp" onclick="salvarLogs()">GRAVAR NO DNA</button>
            <button class="btn-exp" onclick="exportarTXT()">EXPORTAR .TXT</button>
        </div>
    </section>

    <section id="midia" class="room" style="display:none;">
        <h2>📻 MÍDIA SOBERANA (OFFLINE)</h2>
        <input type="file" id="inp-audio" accept="audio/*" hidden onchange="carregarAudio(this)">
        <button class="btn-exp" onclick="document.getElementById('inp-audio').click()">INJETAR MÚSICA</button>
        <div id="player-container" class="res-box">
            <audio id="audio-player" controls style="width:100%"></audio>
        </div>
    </section>

    <section id="saude" class="room" style="display:none;">
        <h2>💧 PROTOCOLO DE OSMOSE</h2>
        <div class="input-group">
            <input type="number" id="peso-mae" placeholder="Seu peso (kg)">
            <button class="btn-exp" onclick="calcularSaude()">GERAR DIRETRIZES</button>
        </div>
        <div id="res-saude" class="res-box"></div>
    </section>

    <section id="reforma" class="room" style="display:none;">
        <h2>🎨 REFORMA DA ATMOSFERA</h2>
        <div class="config-grid">
            <div class="config-card">
                <label>Energia:</label><input type="color" id="cfg-accent" onchange="mutarDNA()">
                <label>Paredes:</label><input type="color" id="cfg-bg" onchange="mutarDNA()">
                <label>Móveis:</label><input type="color" id="cfg-btn" onchange="mutarDNA()">
            </div>
            <div class="config-card">
                <h3>Renomear Cômodos</h3>
                <div id="editor-nomes"></div>
                <button class="btn-exp" onclick="consolidarReforma()">SALVAR REFORMA</button>
            </div>
        </div>
    </section>

    <section id="backup" class="room" style="display:none;">
        <h2>💾 COFRE DE BACKUP</h2>
        <button class="btn-exp" onclick="executarBackup()">MATERIALIZAR BACKUP TOTAL</button>
        <div class="res-box">
            <small>RESTAURAR HABITAÇÃO:</small>
            <input type="file" onchange="restaurarBackup(this)">
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
