<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>C3X4.0 | HABITAÇÃO SOBERANA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="matrix">
<div id="portal-bg">
    <canvas id="canvas-portal"></canvas>
</div>

<header>
  <div class="brand">
    <h1>C3X4.0_MAE</h1>
    <div id="dna-pulse" onclick="verificarAcessoSoberano()" title="Arquiteto José Patrick"></div>
  </div>
  
  <div class="custom-panel">
    <button onclick="toggleSetor('atmosfera')">ATMOSFERA</button> 
    <button onclick="toggleSetor('galeria')">ACERVO</button>
    <button onclick="toggleSetor('notas')">LOGS</button>
    <button onclick="toggleSetor('diagnostico')">SAÚDE</button> 
    <button onclick="backupSoberano()">BACKUP</button>
  </div>
</header>

<main>
    <section class="room" id="telemetria">
        <div class="stats-grid">
            <div class="stat-card"><small>SESSÃO</small><b id="timer">00:00</b></div>
            <div class="stat-card"><small>INTEGRIDADE</small><b id="sys-state">ESTÁVEL</b></div>
            <div class="stat-card"><small>BIO_SAÚDE</small><b id="bio-status">100%</b></div>
        </div>
    </section>

    <section class="room" id="atmosfera" style="display:none;">
        <h2>🎨 COMANDO DE ATMOSFERA</h2>
        <input type="range" id="dna-hue" min="0" max="255" value="145" oninput="ajustarDNA(this.value)">
        <button onclick="aplicarEfeito('glitch')">GLITCH</button>
    </section>

    <section class="room" id="galeria" style="display:none;">
        <h2>🖼 ACERVO (Injeção em Massa)</h2>
        <input type="file" id="inputFoto" multiple hidden onchange="injetarMemoriaMassa(this)">
        <button class="btn-full" onclick="document.getElementById('inputFoto').click()">INJETAR MEMÓRIAS NO DNA</button>
        <div id="grid-galeria" class="gallery-grid"></div>
    </section>

    <section class="room" id="notas" style="display:none;">
        <h2>📒 REGISTROS</h2>
        <textarea id="txtNotas" onkeyup="salvarNota(this.value)"></textarea>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
