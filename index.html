<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>C3X4.0 | MANSÃO SOBERANA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="matrix">
<canvas id="matrix"></canvas>

<header>
  <div class="brand">
    <h1>C3X4.0_MAE</h1>
    <div id="dna-pulse" onclick="acessoSoberano()" title="Identificação Arquiteto"></div>
  </div>
  
  <div class="custom-panel">
    <input type="color" id="colorPicker" onchange="alterarAtmosfera(this.value)" title="Personalizar DNA">
    <button onclick="toggleSetor('galeria')">ACERVO</button>
    <button onclick="toggleSetor('notas')">LOGS</button>
    <button onclick="sincronizarDNA()">BACKUP</button>
  </div>
</header>

<main>
    <section class="room" id="telemetria">
        <div class="stats-grid">
            <div class="stat-card"><small>SESSÃO</small><b id="timer">00:00</b></div>
            <div class="stat-card"><small>PULSO</small><b id="interacoes">0</b></div>
            <div class="stat-card"><small>ESTADO</small><b id="sys-state">ESTÁVEL</b></div>
        </div>
    </section>

    <section class="room" id="galeria">
        <h2>🖼 ACERVO DIGITAL</h2>
        <p class="desc">Processamento local. Soberania total sobre os dados.</p>
        <div class="upload-area">
            <input type="file" id="inputFoto" multiple hidden>
            <button onclick="document.getElementById('inputFoto').click()">INJETAR MEMÓRIA</button>
        </div>
        <div id="grid-galeria"></div>
    </section>

    <section class="room" id="notas">
        <h2>📒 REGISTRO DE DNA</h2>
        <textarea id="txtNotas" placeholder="Escreva no DNA da casa..."></textarea>
    </section>

    <section class="room" id="terminais">
        <div class="grid-buttons">
            <button onclick="window.open('https://wa.me/55')">WHATSAPP_TUNNEL</button>
            <button onclick="window.open('https://x4blaushop.github.io/NIVEL-0/')">GATE_LEVEL_0</button>
        </div>
    </section>
</main>

<div id="aviso-sistema"></div>
<script src="script.js"></script>
</body>
</html>
