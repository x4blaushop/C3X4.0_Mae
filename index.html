<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Habitação Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body class="matrix">

<canvas id="matrix"></canvas>

<header>
  <h1>🏠 Casa Digital</h1>
  <div class="top-controls">
    <button onclick="toggleSimple()">Modo Simples</button>
    <button onclick="toggleTheme()">Tema</button>
    <button onclick="exportData()">Backup</button>
  </div>
</header>

<main>

<section class="room" id="sala">
<h2>🛋 Sala</h2>
<p id="status"></p>
</section>

<section class="room" id="galeria">
<h2>🖼 Galeria</h2>
<input type="file" id="photoInput" multiple>
<div id="gallery"></div>
</section>

<section class="room" id="notas">
<h2>📒 Notas</h2>
<textarea id="notes"></textarea>
</section>

<section class="room" id="graficos">
<h2>📊 Uso da Casa</h2>
<canvas id="chart" width="300" height="150"></canvas>
</section>

<section class="room" id="links">
<h2>🔗 Conexões</h2>
<button onclick="openWhats()">WhatsApp</button>
<button onclick="openLink()">Link Pessoal</button>
<button onclick="openNivel()">Portal Nível 0</button>
</section>

<section class="room">
<h2>📘 Manual</h2>
<details>
<summary>Como usar esta casa</summary>
<p>
Esta é sua habitação digital.<br>
Nada é enviado para fora.<br>
Você pode mudar, ligar ou desligar cômodos.<br>
Tudo é simples, local e seu.
</p>
</details>
</section>

</main>

<footer>
Habitação Digital • Dados locais • Controle total
</footer>

<script src="script.js"></script>
</body>
</html>
