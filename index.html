<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>C3X4.0 | A MANSÃO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mansao-mode">

<canvas id="matrix-bg"></canvas>

<nav class="hud-header">
    <div class="brand">C3X4.0 <span id="pulse"></span></div>
    <div class="nav-links">
        <button onclick="irPara('suite-principal')">SALA</button>
        <button onclick="irPara('acervo')">GALERIA</button>
        <button onclick="irPara('escritorio')">NOTAS</button>
        <button onclick="irPara('central-comando')">SISTEMA</button>
    </div>
</nav>

<main id="viewport">
    <section id="suite-principal" class="room active">
        <div class="content">
            <h1>Bem-vindo à sua Habitação</h1>
            <p id="days-count">Ciclo de vida ativo.</p>
            <div class="interactive-card">
                <span>ESTADO ATUAL</span>
                <strong id="live-status">HARMONIA</strong>
            </div>
        </div>
    </section>

    <section id="acervo" class="room">
        <div class="content">
            <h2>Acervo Digital</h2>
            <div class="upload-zone">
                <input type="file" id="photoInput" multiple>
                <label for="photoInput">ADICIONAR MEMÓRIA</label>
            </div>
            <div id="gallery-grid"></div>
        </div>
    </section>

    <section id="escritorio" class="room">
        <div class="content">
            <h2>Escritório de Dados</h2>
            <textarea id="main-notes" placeholder="O que deseja registrar no DNA hoje?"></textarea>
        </div>
    </section>

    <section id="central-comando" class="room">
        <div class="content">
            <h2>Central de Comando</h2>
            <div class="metrics-grid">
                <div class="m-card">LATÊNCIA <b id="ping">--</b></div>
                <div class="m-card">INTERAÇÕES <b id="clicks">0</b></div>
                <div class="m-card">INTEGRIDADE <b>100%</b></div>
            </div>
            <div class="sys-actions">
                <button onclick="toggleTheme()">DNA SHIFT</button>
                <button onclick="exportData()">SINCRONIZAR</button>
            </div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
