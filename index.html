<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>C3X4.0_Mãe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="matrix-bg"></div>

  <header class="header">
    <h1>C3X4.0 — Casa Mãe</h1>
    <p>Espaço soberano dentro da infraestrutura X4</p>
  </header>

  <main class="container">

    <!-- BLOCO: IDENTIDADE -->
    <section class="card identity">
      <h2>🌱 Presença</h2>
      <p>
        Aqui não se vende.  
        Aqui se mostra.  
        Quem está dentro, entende.
      </p>
    </section>

    <!-- BLOCO: PESQUISA -->
    <section class="card research">
      <h2>🌐 Acesso à Rede Externa</h2>
      <p>Pesquisa livre sem sair do planeta.</p>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Pesquisar na rede..."
          autocomplete="off"
        />
        <button id="searchBtn">Pesquisar</button>
      </div>

      <iframe
        id="searchFrame"
        title="Pesquisa Externa"
        loading="lazy"
        src="https://www.bing.com">
      </iframe>
    </section>

    <!-- BLOCO: PORTAL -->
    <section class="card portal">
      <h2>🌀 Portal NÍVEL 0</h2>
      <a
        href="https://x4blaushop.github.io/NIVEL-0/"
        target="_blank"
        rel="noopener noreferrer">
        Acessar
      </a>
    </section>

  </main>

  <footer class="footer">
    <span>X4 Infrastructure • Casa Autônoma</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
