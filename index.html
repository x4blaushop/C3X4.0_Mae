<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>C3X4.0_MAE | ARQUITETO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="matrix">
<canvas id="matrix"></canvas>

<header>
  <div class="brand">
    <h1>C3X4.0_MAE</h1>
    <div id="status-light"></div>
  </div>
  <div class="top-controls">
    <button onclick="toggleSimple()" id="btn-foco">MODO_FOCO: OFF</button>
    <button onclick="toggleTheme()">SHIFT_DNA</button>
    <button onclick="exportData()">BACKUP_SOBERANO</button>
  </div>
</header>

<main>
    <section class="dashboard">
        <div class="stat">
            <label>FLUXO_SESSÃO</label>
            <span id="timer">00:00</span>
        </div>
        <div class="stat">
            <label>CLIQUES_DNA</label>
            <span id="click-count">0</span>
        </div>
        <div class="stat">
            <label>LATÊNCIA</label>
            <span id="ping">-- ms</span>
        </div>
    </section>

    <section class="room" id="sala">
        <h2>IDENTIDADE</h2>
        <p id="habita-status"></p>
    </section>

    <section class="room" id="galeria">
        <h2>ACERVO_DIGITAL</h2>
        <input type="file" id="photoInput" multiple>
        <div id="gallery"></div>
    </section>

    <section class="room" id="notas">
        <h2>LOG_DE_NOTAS</h2>
        <textarea id="notes" placeholder="Registrar no sistema..."></textarea>
    </section>

    <section class="room" id="conexoes">
        <h2>TERMINAIS_EXTERNOS</h2>
        <div class="grid-buttons">
            <button onclick="openWhats()">WHATSAPP_TUNNEL</button>
            <button onclick="openLink()">EXTERNAL_LINK</button>
            <button onclick="openNivel()">GATE_LEVEL_0</button>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
